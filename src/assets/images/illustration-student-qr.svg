      <rect x="26" y="36" width="16" height="16"/>
      <rect x="68" y="36" width="16" height="16"/>
      <rect x="26" y="78" width="16" height="16"/>
      <rect x="48" y="50" width="8" height="8"/>
      <rect x="60" y="60" width="8" height="8"/>
      <rect x="48" y="70" width="8" height="8"/>
      <rect x="68" y="78" width="8" height="8"/>
      <rect x="80" y="60" width="6" height="6"/>
