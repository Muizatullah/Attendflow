<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qrBlob" x1="0" y1="0" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E7F6ED"/>
      <stop offset="1" stop-color="#CFEEDA"/>
